<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="stylesheet" href="./login.css">
    <title>FoodStore - Login</title>
</head>

<body>
    <form id="form" class="container">
        <h2 class="titulo-login"> Login</h2>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com">
        </div>
        <div>
            <label for="password">password</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="********">
        </div>
        <div>
            <label for="rol">Rol</label>
            <select name="rol" id="rol">
                <option value="">Seleccione un rol</option>
                <option value="client">Cliente</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit" class="boton">Ingresar</button>
        <p>¿No tenes cuenta?, <a href="../registro/registro.html" class="register">Registrate</a> aca!</p>
    </form>

    <script type="module" src="./login.ts"></script>
</body>

</html>
