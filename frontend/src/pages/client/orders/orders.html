<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="orders.css">
    <title>Mis pedidos - FoodStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="header">
        <img src="/favicon.png" alt="" class="logo">
    <h1 class="titulo">FoodStore</h1>
    <nav class="container-menu">
      <a class="menu" href="/src/pages/store/home/home.html">Inicio</a>
      <a class="menu" href="/src/pages/client/orders/Orders.html">Mis pedidos</a>
      <a class="menu" href="/src/pages/store/cart/cart.html">Carrito</a>
    </nav>
    <button id="btn-salir" class="btn-salir">Cerrar Sesión</button>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Mis Pedidos</h1>
    
    <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
      
    </div>

    
    <div id="empty-state" class="hidden text-center py-12">
      <p class="text-gray-500 mb-4">Aún no has realizado ningún pedido.</p>
      <a href="/src/pages/store/home/" class="bg-orange-600 text-white px-4 py-2 rounded-md hover:bg-orange-700 transition">Ir al Catálogo</a>
    </div>
  </main>

  
  <div id="pedido-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg max-w-lg w-full mx-4 p-6 relative shadow-xl">
      <div id="modal-content">
       
      </div>
      <div class="mt-6 flex justify-end">
        <button id="close-modal" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 transition text-sm font-medium">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/client/orders/orders.ts"></script>
    </main>
</body>
</html>
