<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Categorías - Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
  
  <aside class="w-64 bg-white shadow-md flex flex-col justify-between">
    <div>
      <div class="p-6 border-b">
        <h2 class="text-xl font-bold text-orange-600">Food Store</h2>
        <p class="text-xs text-gray-500">Panel de Administración</p>
      </div>
      <nav class="p-4 space-y-2">
        <a href="/src/pages/admin/adminHome/adminHome.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Dashboard</a>
        <a href="/src/pages/admin/categories/categories.html" class="block px-4 py-2 rounded bg-orange-100 text-orange-700 font-semibold">Categorías</a>
        <a href="/src/pages/admin/products/products.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Productos</a>
        <a href="/src/pages/admin/orders/orders.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Pedidos</a>
        <hr class="my-2" />
        <a href="/src/pages/store/home/home.html" class="block px-4 py-2 rounded text-blue-600 hover:bg-blue-50">Ver Tienda</a>
      </nav>
    </div>
    <div class="p-4 border-t">
      <button id="btn-logout" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600 transition">Cerrar Sesión</button>
    </div>
  </aside>

  
  <main class="flex-1 p-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Gestión de Categorías</h1>
      <button id="btn-nueva-categoria" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition font-semibold">
        + Nueva Categoría
      </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-orange-600 text-white">
          <tr>
            <th class="p-3">ID</th>
            <th class="p-3">Imagen</th>
            <th class="p-3">Nombre</th>
            <th class="p-3">Descripción</th>
            <th class="p-3 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-categorias" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </main>

  
  <div id="modal-categoria" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 id="modal-titulo" class="text-xl font-bold text-gray-800">Nueva Categoría</h2>
        <button id="btn-cerrar-modal" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
      </div>
      <form id="form-categoria" class="space-y-4">
        <input type="hidden" id="cat-id" />
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
          <input type="text" id="cat-nombre" required class="w-full border rounded p-2 focus:ring-2 focus:ring-orange-500 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
          <textarea id="cat-descripcion" required rows="3" class="w-full border rounded p-2 focus:ring-2 focus:ring-orange-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">URL de Imagen *</label>
          <input type="url" id="cat-imagen" required placeholder="https://ejemplo.com/imagen.jpg" class="w-full border rounded p-2 focus:ring-2 focus:ring-orange-500 outline-none" />
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" id="btn-cancelar-modal" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700 font-semibold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./categories.ts"></script>
</body>
</html>
