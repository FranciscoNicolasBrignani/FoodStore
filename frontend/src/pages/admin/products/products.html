<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <title>Gestión de Productos - Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
  <aside class="w-64 bg-white shadow-md flex flex-col justify-between">
    <div>
      <div class="p-6 border-b">
        <h2 class="text-xl font-bold text-orange-600">Food Store</h2>
        <p class="text-xs text-gray-500">Panel de Administración</p>
      </div>
      <nav class="p-4 space-y-2">
        <a href="/src/pages/admin/adminHome/adminHome.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Dashboard</a>
        <a href="/src/pages/admin/categories/categories.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Categorías</a>
        <a href="/src/pages/admin/products/products.html" class="block px-4 py-2 rounded bg-orange-100 text-orange-700 font-semibold">Productos</a>
        <a href="/src/pages/admin/orders/orders.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Pedidos</a>
        <hr class="my-2" />
        <a href="/src/pages/store/home/home.html" class="block px-4 py-2 rounded text-blue-600 hover:bg-blue-50">Ver Tienda</a>
      </nav>
    </div>
    <div class="p-4 border-t">
      <button id="btn-logout" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600 transition">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-x-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Gestión de Productos</h1>
      <button id="btn-nuevo-producto" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition font-semibold">
        + Nuevo Producto
      </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-orange-600 text-white text-sm">
          <tr>
            <th class="p-3">ID</th>
            <th class="p-3">Imagen</th>
            <th class="p-3">Nombre</th>
            <th class="p-3">Descripción</th>
            <th class="p-3">Precio</th>
            <th class="p-3">Categoría</th>
            <th class="p-3">Stock</th>
            <th class="p-3">Estado</th>
            <th class="p-3 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos" class="divide-y divide-gray-200 text-sm"></tbody>
      </table>
    </div>
  </main>

  <div id="modal-producto" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-lg shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 id="modal-prod-titulo" class="text-xl font-bold text-gray-800">Nuevo Producto</h2>
        <button id="btn-cerrar-prod-modal" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
      </div>
      <form id="form-producto" class="space-y-3">
        <input type="hidden" id="prod-id" />
        <div>
          <label class="block text-sm font-medium text-gray-700">Nombre *</label>
          <input type="text" id="prod-nombre" required class="w-full border rounded p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Descripción *</label>
          <textarea id="prod-descripcion" required rows="2" class="w-full border rounded p-2"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700">Precio ($) *</label>
            <input type="number" id="prod-precio" step="0.01" min="0.01" required class="w-full border rounded p-2" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Stock *</label>
            <input type="number" id="prod-stock" min="0" required class="w-full border rounded p-2" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Categoría *</label>
          <select id="prod-categoria" required class="w-full border rounded p-2 bg-white"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">URL de Imagen *</label>
          <input type="url" id="prod-imagen" required placeholder="https://ejemplo.com/foto.jpg" class="w-full border rounded p-2" />
        </div>
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="prod-disponible" checked class="w-4 h-4 text-orange-600" />
          <label for="prod-disponible" class="text-sm font-medium text-gray-700">Producto Disponible</label>
        </div>
        <div class="flex justify-end gap-2 pt-4 border-t">
          <button type="button" id="btn-cancelar-prod-modal" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700 font-semibold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./products.ts"></script>
</body>
</html>
