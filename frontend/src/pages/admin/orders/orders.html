<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Pedidos - Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md flex flex-col justify-between">
    <div>
      <div class="p-6 border-b">
        <h2 class="text-xl font-bold text-orange-600">Food Store</h2>
        <p class="text-xs text-gray-500">Panel de Administración</p>
      </div>
      <nav class="p-4 space-y-2">
        <a href="/src/pages/admin/adminHome/adminHome.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Dashboard</a>
        <a href="/src/pages/admin/categories/categories.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Categorías</a>
        <a href="/src/pages/admin/products/products.html" class="block px-4 py-2 rounded text-gray-700 hover:bg-orange-50">Productos</a>
        <a href="/src/pages/admin/orders/orders.html" class="block px-4 py-2 rounded bg-orange-100 text-orange-700 font-semibold">Pedidos</a>
        <hr class="my-2" />
        <a href="/src/pages/store/home/home.html" class="block px-4 py-2 rounded text-blue-600 hover:bg-blue-50">Ver Tienda</a>
      </nav>
    </div>
    <div class="p-4 border-t">
      <button id="btn-logout" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600 transition">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Gestión de Pedidos</h1>
      <div class="flex items-center gap-2">
        <label for="filtro-estado" class="text-sm font-medium text-gray-700">Filtrar por estado:</label>
        <select id="filtro-estado" class="border rounded-lg p-2 bg-white text-sm shadow-sm">
          <option value="TODOS">Todos los pedidos</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="CONFIRMADO">Confirmado</option>
          <option value="TERMINADO">Terminado</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
      </div>
    </div>

    <div id="admin-orders-list" class="space-y-4"></div>
  </main>

  <!-- Modal Detalle y Cambio de Estado -->
  <div id="modal-pedido-admin" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-lg shadow-xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 id="modal-pedido-titulo" class="text-xl font-bold text-gray-800">Detalle del Pedido</h2>
        <button id="btn-cerrar-pedido-modal" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
      </div>
      
      <div id="modal-pedido-body" class="space-y-4 text-sm text-gray-700"></div>

      <div class="mt-6 pt-4 border-t">
        <label class="block text-sm font-bold text-gray-700 mb-2">Cambiar Estado del Pedido:</label>
        <div class="flex gap-3">
          <select id="select-nuevo-estado" class="flex-1 border rounded p-2 bg-white">
            <option value="PENDIENTE">PENDIENTE</option>
            <option value="CONFIRMADO">CONFIRMADO</option>
            <option value="TERMINADO">TERMINADO</option>
            <option value="CANCELADO">CANCELADO</option>
          </select>
          <button id="btn-actualizar-estado" class="bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700 transition">
            Actualizar Estado
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./orders.ts"></script>
</body>
</html>
